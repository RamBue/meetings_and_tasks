services:
  backend:
    build: ./backend
    ports:
      - "5002:5002"
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5002
    ports:
      - "8080:80"
    depends_on:
      - backend

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  uploads:
