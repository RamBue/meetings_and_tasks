services:
  - type: web
    name: meetings-backend
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: meetings-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
